<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Markdown zu PDF Konverter</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
    <h1>✨ Markdown zu PDF Konverter</h1>

    <!-- Dark Mode Toggle -->
    <div class="theme-toggle-container">
        <span class="theme-label">☀️ Hell</span>
        <label class="theme-switch">
            <input type="checkbox" id="themeToggle">
            <span class="slider"></span>
        </label>
        <span class="theme-label">🌙 Dunkel</span>
    </div>

    <div class="content-wrapper">
        <!-- Rest bleibt gleich... -->

        <!-- Tabs für Auswahl -->
        <div class="tabs">
            <button class="tab-btn active" id="uploadTab">📁 Datei hochladen</button>
            <button class="tab-btn" id="editorTab">✍️ Direkt schreiben</button>
        </div>

        <!-- Upload-Bereich mit Drag & Drop -->
        <div id="uploadSection" class="section">
            <!-- Toggle für Einzel/Mehrfach -->
            <div class="upload-mode-toggle">
                <label>
                    <input type="radio" name="uploadMode" value="single" checked>
                    Einzelne Datei
                </label>
                <label>
                    <input type="radio" name="uploadMode" value="multiple">
                    Mehrere Dateien zusammenfügen
                </label>
            </div>

            <div id="dropZone" class="drop-zone">
                <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <h3 id="dropZoneTitle">Markdown-Datei hier ablegen</h3>
                <p>oder</p>
                <label for="fileInput" class="file-input-label">
                    <span id="fileButtonText">Datei auswählen</span>
                </label>
                <input type="file" id="fileInput" accept=".md" style="display: none;">
                <p class="file-info" id="fileInfo"></p>
            </div>

            <!-- Liste der hochgeladenen Dateien -->
            <div id="filesList" style="display: none;">
                <h3>Hochgeladene Dateien (in dieser Reihenfolge):</h3>
                <ul id="filesListItems"></ul>
                <button id="clearFilesBtn" class="secondary-btn">Alle entfernen</button>
            </div>
        </div>

        <!-- Editor-Bereich mit Preview -->
        <div id="editorSection" class="section" style="display: none;">
            <div class="editor-container">
                <div class="editor-panel">
                    <h3>📝 Markdown eingeben</h3>
                    <textarea id="markdownEditor" placeholder="# Deine Überschrift

Schreibe hier dein Markdown...

- Punkt 1
- Punkt 2

**Fetter Text** und *kursiver Text*"></textarea>
                </div>
                <div class="preview-panel">
                    <h3>👁️ Live Vorschau</h3>
                    <div id="markdownPreview"></div>
                </div>
            </div>
        </div>

        <!-- Dateiname Eingabe -->
        <div class="filename-section">
            <label for="filenameInput">📄 PDF-Dateiname:</label>
            <input type="text" id="filenameInput" placeholder="mein-dokument" value="dokument">
            <span>.pdf</span>
        </div>

        <!-- PDF Style Optionen -->
        <div class="pdf-styles-section">
            <h3>🎨 PDF-Styling</h3>
            <div class="style-options">
                <div class="style-option">
                    <label for="fontSize">Schriftgröße:</label>
                    <select id="fontSize">
                        <option value="small">Klein (10pt)</option>
                        <option value="normal" selected>Normal (12pt)</option>
                        <option value="large">Groß (14pt)</option>
                        <option value="xlarge">Sehr groß (16pt)</option>
                    </select>
                </div>

                <div class="style-option">
                    <label for="fontFamily">Schriftart:</label>
                    <select id="fontFamily">
                        <option value="serif" selected>Serif (Times New Roman)</option>
                        <option value="sans-serif">Sans-Serif (Arial)</option>
                        <option value="monospace">Monospace (Courier)</option>
                    </select>
                </div>

                <div class="style-option">
                    <label for="margins">Seitenränder:</label>
                    <select id="margins">
                        <option value="narrow">Schmal (1cm)</option>
                        <option value="normal" selected>Normal (2cm)</option>
                        <option value="wide">Breit (3cm)</option>
                    </select>
                </div>

                <div class="style-option">
                    <label for="lineHeight">Zeilenabstand:</label>
                    <select id="lineHeight">
                        <option value="compact">Kompakt (1.3)</option>
                        <option value="normal" selected>Normal (1.6)</option>
                        <option value="relaxed">Entspannt (2.0)</option>
                    </select>
                </div>
            </div>
        </div>

        <button id="convertBtn">🚀 Konvertieren zu PDF</button>

        <!-- Ladebalken -->
        <div id="loadingContainer" style="display: none;">
            <div id="loadingBar"></div>
            <p id="loadingText">Wird konvertiert...</p>
        </div>

        <div id="status"></div>
    </div>
</div>
<div id="pdfPreviewModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>📄 PDF-Vorschau</h2>
            <button class="close-btn" id="closePreview">&times;</button>
        </div>
        <div class="modal-body">
            <iframe id="pdfPreviewFrame" src=""></iframe>
        </div>
        <div class="modal-footer">
            <button id="downloadPdfBtn" class="download-btn">💾 PDF herunterladen</button>
            <button id="closePreviewBtn" class="secondary-btn">Schließen</button>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
